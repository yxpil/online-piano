name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Verify committed CSS is current
        run: npm run build && git diff --exit-code -- css/style.css

      - name: Package
        run: |
          set -euo pipefail
          PKG="online-piano-${GITHUB_REF_NAME}-web"
          git archive --format=zip --prefix="$PKG/" HEAD -o "$PKG.zip"
          ls -lh "$PKG.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: "*.zip"

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
      - name: Checksums
        run: sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            *
          generate_release_notes: true
          body: |
            ## online-piano ${{ github.ref_name }}

            纯前端离线包。解压后直接打开 `index.html` 即可使用，无需后端。

            - 产物：`online-piano-${{ github.ref_name }}-web.zip`
            - 校验：同页附 `SHA256SUMS.txt`。
